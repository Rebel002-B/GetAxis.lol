    .dl { max-width: 900px; margin: 0 auto; padding: 18px 4vw; width: 100%; }

    .dl ul { list-style: none; margin: 0; padding: 0; }
    .dl li { opacity: 0; animation: fade .5s var(--ease) forwards; animation-delay: calc(var(--i) * 45ms); }
    .dl li a { display: flex; justify-content: space-between; gap: 20px; padding: 11px 0; border-bottom: 1px solid var(--rule); color: var(--ink); text-decoration: none; transition: color .15s, padding-left .18s var(--ease); }
    .dl li a:hover { color: var(--accent); padding-left: 10px; }
    .dl li span { color: var(--dim); white-space: nowrap; }
    .dl .none { color: var(--dim); }
  </style>
